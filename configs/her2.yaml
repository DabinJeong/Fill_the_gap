# HER2 — ASIGN 3D protocol (NOT interleaved).
# Only level 1 (the single known 2D ST slide) is observed; predict ALL other
# sections (levels >= 2). Score PCC/MSE/MAE on the predicted spots, per sample,
# then average over all 8 samples (A-H). Matches ASIGN main_3d.py: known = level 1,
# eval on pred[level > 1]. heldout_levels: null -> parity_split holds out every
# level except train_levels.
dataset:
  root: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_serial_sections
  name: HER2_3D
  samples: [A, B, C, D, E, F, G, H]
  held_out_parity: even
  train_levels: [1]
  heldout_levels: null   # -> {all levels} - {1} = 2..6 (A-D) / 2..3 (E-H)
  z_spacing: 1.0
  G: 250

model:
  init_opacity: 0.9
  scale_knn: 3
  init_scale_mult: 2.0
  densify_z: false

render:
  knn_k: 32
  chunk: 8192

# Same winning regime as the interleaved study: initialized field, no optimization
# (supervision lives only on the single known plane, so optimizing overfits it).
optim:
  iterations: 0
  lr_xyz: 0.0
  lr_feature: 0.0
  lr_opacity: 2.0e-2
  lr_scaling: 2.0e-3
  lr_rotation: 2.0e-3

densify:
  start: 1
  end: 0
  interval: 100
  grad_thresh: 2.0e-4
  min_opacity: 0.005
  opacity_reset_interval: 0
  max_gaussians: 200000

loss:
  w_cos: 0.0
  w_opacity: 0.0
  w_scale: 0.0

output_dir: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/HistoGS/runs/her2_asign
device: cuda
seed: 0
log_interval: 200
