# ST-Data (ST_Breast_3D) — ASIGN 3D protocol (NOT interleaved).
# Only level 1 (single known 2D ST slide) observed; predict levels >= 2 (i.e. 2,3).
# Score PCC/MSE/MAE on predicted spots, per sample, averaged over all 16 samples.
# Matches ASIGN main_3d.py cross-sample eval: known = level 1, eval on pred[level > 1].
dataset:
  root: /lustre/scratch126/cellgen/lotfollahi/dj16/data/public_serial_sections
  name: ST_Breast_3D
  samples: [23272, 23277, 23377, 23450, 23506, 23508, 23567, 23803,
            23810, 23895, 23903, 23944, 24044, 24105, 24220, 24223]
  held_out_parity: even
  train_levels: [1]
  heldout_levels: null   # -> {1,2,3} - {1} = {2,3}
  z_spacing: 1.0
  G: 250

model:
  init_opacity: 0.9
  scale_knn: 3
  init_scale_mult: 2.0
  densify_z: false

render:
  knn_k: 32
  chunk: 8192

optim:
  iterations: 0
  lr_xyz: 0.0
  lr_feature: 0.0
  lr_opacity: 2.0e-2
  lr_scaling: 2.0e-3
  lr_rotation: 2.0e-3

densify:
  start: 1
  end: 0
  interval: 100
  grad_thresh: 2.0e-4
  min_opacity: 0.005
  opacity_reset_interval: 0
  max_gaussians: 200000

loss:
  w_cos: 0.0
  w_opacity: 0.0
  w_scale: 0.0

output_dir: /lustre/scratch126/cellgen/lotfollahi/dj16/projects/HistoGS/runs/stdata_asign
device: cuda
seed: 0
log_interval: 200
